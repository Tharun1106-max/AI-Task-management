# ==============================================================================
# TaskPilot Frontend - Production Nginx Configuration
# High-Performance SPA Routing, Gzip Compression, and Security Headers
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Character encoding
    charset utf-8;

    # --------------------------------------------------------------------------
    # 1. High-Performance Gzip Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # --------------------------------------------------------------------------
    # 2. Security Headers (Defense-in-Depth)
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' http: https: ws: wss:; frame-ancestors 'none';" always;

    # --------------------------------------------------------------------------
    # 3. Static Assets & Immutable Caching
    # --------------------------------------------------------------------------
    # Fingerprinted Vite build chunks (/assets/*.js, /assets/*.css)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Static media, icons, and fonts
    location ~* \.(ico|jpg|jpeg|png|gif|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Lightweight health check endpoint for orchestrators (Kubernetes / Compose)
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # --------------------------------------------------------------------------
    # 4. Client-Side SPA Routing & Index HTML
    # --------------------------------------------------------------------------
    # Never cache index.html to guarantee instantaneous continuous deployments
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires off;
    }

    # Route all navigation requests back to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Standard error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
